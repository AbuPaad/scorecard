<!DOCTYPE html>
<html>
<head>
    <title>CSS3 Image Effects</title>
    <link rel="stylesheet" href="css-images.css">
</head>
<body>
    <h1>CSS3 Image Effects</h1>

    <p>1. Butterfly</p>
    <img src="css_images/img/butterfly.jpg" class="butterfly">

    <p>2. Dinosaur</p>
    <img src="css_images/img/dinosaur.png" class="dino">

    <p>3. Football Field</p>
    <div class="field">
        <img src="css_images/img/football_field.jpg" class="fieldimg">
        <img src="css_images/img/tic-tac-toe.png" class="tic">
    </div>

    <p>4. Penguins</p>
    <img src="css_images/img/penguins.jpg" class="penguins">

    <p>5. Seagull</p>
    <div class="seagullbox">
        <img src="css_images/img/seagull.png" class="seagull">
    </div>

    <p>6. Theater Stage</p>
    <div class="theater">
        <img src="css_images/img/theater_stage.jpg" class="stage">
        <div class="shade"></div>
    </div>
</body>
</html>
